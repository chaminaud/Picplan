{% extends "base.html" %}
{% block content %}
<div class="mx-auto max-w-md">
  <div class="mb-6 text-center"><div class="mx-auto grid h-14 w-14 place-items-center rounded-2xl bg-indigo-100 text-2xl">🔐</div><h1 class="mt-4 text-3xl font-bold">{{ t("admin_login") }}</h1><p class="mt-2 text-slate-600">{{ t("admin_login_description") }}</p></div>
  <form action="/admin/login" method="post" class="rounded-2xl border bg-white p-6 shadow-sm">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    {% if not admin_configured %}<p class="mb-4 rounded-xl bg-amber-50 p-3 text-sm text-amber-900">{{ t("admin_not_configured") }}</p>{% endif %}
    {% if login_error and admin_configured %}<p class="mb-4 rounded-xl bg-rose-50 p-3 text-sm text-rose-800">{{ t("invalid_password") }}</p>{% endif %}
    <label class="block text-sm font-semibold">{{ t("password") }}<input type="password" name="password" required autocomplete="current-password" class="mt-2 w-full rounded-xl border px-3 py-3"></label>
    <button {% if not admin_configured %}disabled{% endif %} class="mt-5 w-full rounded-xl bg-indigo-700 px-4 py-3 font-semibold text-white enabled:hover:bg-indigo-800 disabled:cursor-not-allowed disabled:opacity-50">{{ t("sign_in") }}</button>
  </form>
</div>
{% endblock %}
